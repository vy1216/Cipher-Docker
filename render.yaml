services:
  - type: web
    name: cipher
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      # Required secrets: set these in Render, never commit them.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Production LLM: Gemini only. Ollama/Qwen3 is intentionally not deployed.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK_ORDER
        value: gemini
      - key: GEMINI_ENABLED
        value: "true"
      - key: OPENROUTER_ENABLED
        value: "false"
      - key: OLLAMA_ENABLED
        value: "false"

      # Model/runtime configuration.
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GEMINI_MODEL_FALLBACKS
        value: gemini-3.7-flash
      - key: CIPHER_FACE_MODEL
        value: buffalo_l
      - key: CIPHER_FACE_PROVIDERS
        value: CPUExecutionProvider
      - key: CIPHER_FACE_MODEL_ROOT
        value: /tmp/cipher-models

      # Render filesystem is temporary. Evidence itself is stored in Supabase.
      - key: CIPHER_UPLOADS_DIR
        value: /tmp/cipher-uploads
      - key: CIPHER_RAG_DIR
        value: /tmp/cipher-rag
      - key: CIPHER_FRONTEND_DIR
        value: /app/frontend
      - key: CIPHER_USE_BACKGROUND_TASKS
        value: "true"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: SEED_DEMO_DATA
        value: "false"

      - key: NEO4J_DATABASE
        value: neo4j
      - key: NEO4J_REQUIRED_FOR_GRAPH
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: cipher-evidence
      - key: CIPHER_CORS_ORIGINS
        value: "*"
